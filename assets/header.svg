<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glowing Radial Spheres -->
    <radialGradient id="glowLeft" cx="15%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowText" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 54px;
      font-weight: 800;
      letter-spacing: 3px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #e2e8f0;
    }
    .badge-text {
      font-family: 'SF Mono', Monaco, 'Cascadia Code', Consolas, monospace;
      font-size: 13px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.15;
      stroke-width: 1;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="240" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <circle cx="150" cy="80" r="180" fill="url(#glowLeft)" />
  <circle cx="750" cy="100" r="200" fill="url(#glowRight)" />

  <!-- Subtle Cyber Grid -->
  <line x1="100" y1="0" x2="100" y2="240" class="grid-line" />
  <line x1="250" y1="0" x2="250" y2="240" class="grid-line" />
  <line x1="400" y1="0" x2="400" y2="240" class="grid-line" />
  <line x1="550" y1="0" x2="550" y2="240" class="grid-line" />
  <line x1="700" y1="0" x2="700" y2="240" class="grid-line" />
  <line x1="850" y1="0" x2="850" y2="240" class="grid-line" />
  <line x1="0" y1="60" x2="900" y2="60" class="grid-line" />
  <line x1="0" y1="120" x2="900" y2="120" class="grid-line" />
  <line x1="0" y1="180" x2="900" y2="180" class="grid-line" />

  <!-- Waves at Bottom -->
  <path d="M0,195 C150,175 350,225 500,200 C650,175 750,215 900,195 L900,240 L0,240 Z" fill="url(#wave1)" />
  <path d="M0,210 C180,185 320,230 480,215 C640,200 780,225 900,210 L900,240 L0,240 Z" fill="url(#wave2)" />

  <!-- Top Status Badge -->
  <g transform="translate(340, 26)">
    <rect width="220" height="26" rx="13" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="15" cy="13" r="4" fill="#22c55e" />
    <text x="26" y="17" class="badge-text" fill="#38bdf8">OPEN FOR OPPORTUNITIES</text>
  </g>

  <!-- Main Title -->
  <g filter="url(#shadow)">
    <text x="450" y="112" text-anchor="middle" class="title" filter="url(#glowText)">DAT HO</text>
  </g>

  <!-- Subtitle -->
  <text x="450" y="152" text-anchor="middle" class="subtitle">
    FULL-STACK DEVELOPER  •  AI &amp; IOT BUILDER
  </text>

  <!-- Location & Tech Info -->
  <g transform="translate(450, 182)">
    <text x="0" y="0" text-anchor="middle" class="badge-text">
      📍 Da Nang City, Vietnam   |   ⚡ .NET • NestJS • Vue • Angular • Python
    </text>
  </g>
</svg>
